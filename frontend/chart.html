<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoTrader | Interactive Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        .chart-page-container {
            display: flex;
            height: 100vh;
            background-color: #0f172a;
            color: #f0f4f8;
            overflow: hidden;
        }

        .chart-sidebar {
            width: 300px;
            background: #1e293b;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 10;
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #f0f4f8;
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f0f4f8;
            margin: 0;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 600;
        }

        .toggle-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .chart-main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .chart-container-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
        }

        #detailedChart {
            width: 100%;
            height: 100%;
        }

        /* Checkbox styling */
        .toggle-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #475569;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .toggle-checkbox:checked {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .toggle-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>

<body>
    <div class="chart-page-container">
        <!-- Sidebar Controls -->
        <aside class="chart-sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="back-btn">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to Dashboard
                </a>
                <h1 class="chart-title" id="strategyName">Chart Analysis</h1>
            </div>

            <div class="controls-section">
                <h3 class="section-title">Overlays</h3>
                <div class="toggle-list" id="overlaysList">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="controls-section">
                <h3 class="section-title">Signals</h3>
                <div class="toggle-list" id="signalsList">
                    <label class="toggle-item">
                        <span class="toggle-label">
                            <span class="color-dot" style="background-color: #10b981;"></span>
                            Buy Signals
                        </span>
                        <input type="checkbox" class="toggle-checkbox" id="toggleBuy" checked>
                    </label>
                    <label class="toggle-item">
                        <span class="toggle-label">
                            <span class="color-dot" style="background-color: #ef4444;"></span>
                            Sell Signals
                        </span>
                        <input type="checkbox" class="toggle-checkbox" id="toggleSell" checked>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Main Chart Area -->
        <main class="chart-main">
            <div class="chart-container-wrapper" id="chartContainer">
                <!-- Lightweight Chart renders here -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        // Init logic for chart page
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/chart-data');
                const data = await response.json();

                if (data.success) {
                    renderTradingChart(data); // Using new function name
                    document.getElementById('strategyName').textContent = data.strategy.name;
                } else {
                    alert('No backtest data found. Please run a backtest first.');
                    window.location.href = 'index.html';
                }
            } catch (e) {
                console.error('Error fetching chart data:', e);
                alert('Error loading chart data.');
            }
        });
    </script>
</body>

</html>
